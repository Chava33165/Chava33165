name: Stats del perfil

on:
  schedule:
    - cron: "17 9 * * *"   # diario, 3:17 am en Guadalajara
  workflow_dispatch:
  push:
    paths: [".github/scripts/generar.py"]

permissions:
  contents: write

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dibujar los SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generar.py "${{ github.repository_owner }}"
      - name: Guardar si cambiaron
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Stats del día"
            git push
          fi
